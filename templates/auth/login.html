<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hospital Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 400px;
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #007bff;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            background: #ffe5e5;
            color: #c00;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 18px;

            text-align: center;
        }

        .roles {
            margin-top: 25px;

            padding: 15px;

            background: #f8f9fa;

            border-radius: 6px;

            font-size: 13px;

            color: #555;
        }

        .roles strong {
            color: #222;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h1>Hospital Login</h1>

        <p class="subtitle">
            Patient Record and Treatment Tracking System
        </p>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST"
              action="{{ url_for('web_auth.web_login') }}">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="roles">

            <strong>Login access:</strong>

            <br><br>

            Admin → Admin Dashboard

            <br>

            Doctor → Doctor Dashboard

            <br>

            Patient → Patient Dashboard

        </div>

    </div>

</body>

</html>

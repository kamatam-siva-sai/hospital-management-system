<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .back {
            background: white;
            color: #1f4e79;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #1f4e79;
            margin-top: 0;
        }

        .info {
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
            font-size: 17px;
        }

        .info:last-child {
            border-bottom: none;
        }

        .info strong {
            display: inline-block;
            width: 180px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="header">

        <h1>
            Doctor Details
        </h1>

        <a
            href="{{ url_for(
                'admin_doctor_web.admin_doctor_list'
            ) }}"
            class="back"
        >
            Back
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h2>
                Doctor Information
            </h2>


            <div class="info">

                <strong>
                    Doctor ID:
                </strong>

                {{ doctor.id }}

            </div>


            <div class="info">

                <strong>
                    Name:
                </strong>

                {{ doctor.name }}

            </div>


            <div class="info">

                <strong>
                    Specialization:
                </strong>

                {{ doctor.specialization }}

            </div>


            <div class="info">

                <strong>
                    Appointments:
                </strong>

                {{ doctor.appointments|length }}

            </div>

        </div>

    </div>

</body>

</html>

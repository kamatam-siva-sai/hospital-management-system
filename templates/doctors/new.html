<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Doctor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .back {
            background: white;
            color: #1f4e79;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #1f4e79;
            margin-top: 0;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e79;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .cancel {
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #198754;
            color: white;
        }

        button:hover {
            background: #146c43;
        }

        .cancel {
            background: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">

        <h1>
            Add Doctor
        </h1>

        <a
            href="{{ url_for(
                'admin_doctor_web.admin_doctor_list'
            ) }}"
            class="back"
        >
            Back to Doctors
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h2>
                Doctor Information
            </h2>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for(
                    'admin_doctor_web.admin_doctor_create'
                ) }}"
            >

                <div class="group">

                    <label for="name">
                        Doctor Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter doctor name"
                        required
                    >

                </div>


                <div class="group">

                    <label for="specialization">
                        Specialization
                    </label>

                    <input
                        type="text"
                        id="specialization"
                        name="specialization"
                        placeholder="Enter specialization"
                        required
                    >

                </div>


                <div class="buttons">

                    <button type="submit">
                        Add Doctor
                    </button>

                    <a
                        href="{{ url_for(
                            'admin_doctor_web.admin_doctor_list'
                        ) }}"
                        class="cancel"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>

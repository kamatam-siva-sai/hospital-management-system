<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Details</title>


    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f9;
        }

        .header {
            background: #1f4e79;

            color: white;

            padding: 20px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .back {
            background: white;

            color: #1f4e79;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-weight: bold;
        }

        .container {
            width: 90%;

            max-width: 700px;

            margin: 40px auto;
        }

        .card {
            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #1f4e79;

            margin-top: 0;
        }

        .info {
            padding: 15px 0;

            border-bottom: 1px solid #ddd;

            font-size: 17px;
        }

        .info:last-child {
            border-bottom: none;
        }

        .info strong {
            display: inline-block;

            width: 150px;

            color: #555;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>
            Patient Details
        </h1>

        <a
            href="{{ url_for(
                'admin_patient_web.admin_patient_list'
            ) }}"
            class="back"
        >
            Back
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h2>
                Patient Information
            </h2>


            <div class="info">

                <strong>
                    Patient ID:
                </strong>

                {{ patient.id }}

            </div>


            <div class="info">

                <strong>
                    Name:
                </strong>

                {{ patient.name }}

            </div>


            <div class="info">

                <strong>
                    Age:
                </strong>

                {{ patient.age }}

            </div>


            <div class="info">

                <strong>
                    Gender:
                </strong>

                {{ patient.gender }}

            </div>


            <div class="info">

                <strong>
                    Contact:
                </strong>

                {{ patient.contact }}

            </div>


        </div>

    </div>


</body>

</html>

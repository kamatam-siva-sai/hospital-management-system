<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Patient</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            color: #333;
        }


        .header {

            background: #1f4e79;

            color: white;

            padding: 20px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .header h1 {

            margin: 0;

            font-size: 26px;
        }


        .back-button {

            background: white;

            color: #1f4e79;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 6px;

            font-weight: bold;
        }


        .container {

            width: 90%;

            max-width: 750px;

            margin: 40px auto;
        }


        .card {

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }


        .card h2 {

            margin-top: 0;

            color: #1f4e79;

            margin-bottom: 25px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #444;
        }


        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #1f4e79;
        }


        .error {

            background: #f8d7da;

            color: #721c24;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;
        }


        .buttons {

            display: flex;

            gap: 15px;

            margin-top: 25px;
        }


        .save-button {

            background: #198754;

            color: white;

            border: none;

            padding: 12px 25px;

            border-radius: 6px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .save-button:hover {

            background: #146c43;
        }


        .cancel-button {

            background: #6c757d;

            color: white;

            text-decoration: none;

            padding: 12px 25px;

            border-radius: 6px;

            font-weight: bold;
        }


        .cancel-button:hover {

            background: #555;
        }


        @media (max-width: 600px) {

            .header {

                flex-direction: column;

                gap: 15px;

                text-align: center;
            }


            .container {

                width: 95%;
            }


            .buttons {

                flex-direction: column;
            }


            .save-button,
            .cancel-button {

                text-align: center;

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="header">

        <h1>
            Add Patient
        </h1>


        <a
            href="{{ url_for(
                'admin_patient_web.admin_patient_list'
            ) }}"
            class="back-button"
        >
            Back to Patients
        </a>

    </div>


    <div class="container">


        <div class="card">


            <h2>
                Patient Information
            </h2>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for(
                    'admin_patient_web.admin_patient_create'
                ) }}"
            >


                <div class="form-group">

                    <label for="name">
                        Patient Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter patient name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="1"
                        max="120"
                        placeholder="Enter age"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="contact">
                        Contact Number
                    </label>

                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        placeholder="Enter contact number"
                        required
                    >

                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="save-button"
                    >
                        Add Patient
                    </button>


                    <a
                        href="{{ url_for(
                            'admin_patient_web.admin_patient_list'
                        ) }}"
                        class="cancel-button"
                    >
                        Cancel
                    </a>

                </div>


            </form>


        </div>


    </div>


</body>

</html>
